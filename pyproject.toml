[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyphaesbin"
version = "9.6.0"
description = "TE-aware multi-modal beta-VAE metagenome binning for microbial eukaryotes"
requires-python = ">=3.9"
# Python dependencies (install.sh / conda provide them; listed so a plain `pip install` of the wheel is complete).
# External tools (minimap2, samtools, seqkit, skani, coverm, barrnap, prodigal, mmseqs2) and the Tiara/Whokaryote
# classifier env come from conda -- see environment.yaml / install.sh.
dependencies = [
  "pyyaml",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy",
  "scikit-learn>=1.3",
  "biopython",
  "psutil",
  "torch>=2.1",
  "hdbscan>=0.8.33",
]

[project.optional-dependencies]
faiss = ["faiss-cpu"]

[project.scripts]
hyphaesbin = "hyphaesbin.pipeline:main"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["hyphaesbin*"]
namespaces = true
