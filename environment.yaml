# =============================================================================
# HyphaeSBin_env -- main pipeline environment (v9)
# =============================================================================
# Create everything with ONE command:   bash install.sh            (recommended)
#   or only this env:                   mamba env create -f environment.yaml
#
# Solver-verified on linux-64 with conda-forge + bioconda, STRICT channel priority (2026-11):
#   python 3.10 | pytorch 2.x (cpu) | numpy 2.2 | scikit-learn 1.7 | hdbscan 0.8.44 | faiss-cpu 1.14
#   minimap2 2.31 | samtools 1.25 | seqkit 2.14 | skani 0.4 | coverm 0.8 | barrnap 1.10 + hmmer 3.4
#   prodigal 2.6.3 | mmseqs2 18
# NOT in this env (on purpose, see hyphaesbin/utils/envs.py):
#   * Tiara + Whokaryote -> HyphaeSBin_classify (tiara needs python<3.10 + torch 1.7 + numpy 1.19, whokaryote
#     pins python 3.8 + scikit-learn 1.0.2 -> they would downgrade this env). install.sh builds it; the pipeline
#     finds it automatically (no activation needed).
#   * EukCC -> its own env (config eukcc_conda_env), `bash install.sh --with-eukcc`.
# 'defaults' and 'pytorch' channels are deliberately NOT used (mixing them caused the old conflicts).
# =============================================================================
name: HyphaeSBin_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  # python packages
  - pyyaml
  - numpy>=1.24,<2.3
  - pandas>=2.0
  - scipy
  - scikit-learn>=1.3
  - biopython
  - psutil
  - pytorch>=2.1          # CPU build from conda-forge; GPU: install pytorch with cuda from conda-forge in this env
  - hdbscan>=0.8.33
  - faiss-cpu
  # external tools
  - minimap2>=2.26
  - samtools>=1.19
  - seqkit>=2.5
  - skani>=0.2
  - coverm>=0.7
  - barrnap>=1.10         # kingdoms bac/arc/fun (0.9 builds: bac/arc/euk/mito) -- resolved automatically
  - hmmer>=3.3            # nhmmer, used by barrnap
  - prodigal=2.6.3        # used by Whokaryote (also present in the classifier env)
  - mmseqs2               # TE features (the only TE search mode)
