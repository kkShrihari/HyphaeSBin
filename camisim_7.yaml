# =============================================================================
# MULTI-RUN MODE (new) -- all keys are inert while all_runs / te_runs / modality_runs / best_of_it are off.
# The shared steps (preprocessing, coverage, TNF, TE) run ONCE; then each modality combination gets its own
# <outdir>/runs/<tag>/encoder and <outdir>/runs/<tag>/clustering.
# Tags: te | tnf | cov | tetnf | tecov | tnfcov | tetnfcov (= TNF+TE+COV = the original single pipeline)
# =============================================================================
all_runs: true           # run all 7 modality combinations
te_runs: false           # all_runs already selects the TE combinations
modality_runs: []        # extra explicit tags, e.g. [tnfcov, tecov] (added to the two switches above)
best_of_it: true         # pool selected runs and keep the best duplicate-bin representatives
                         #       (highest completeness - 5 x contamination by EukCC), then EukCC on the result
                         #       -> <outdir>/best_of_it   (individual runs untouched). Needs eukcc_db / eukcc_conda_env below.
best_of_runs: [tetnfcov, tnfcov] # pool only the requested two runs
best_of_af_mode: contained   # contained: a partial copy inside a bigger bin counts as duplicate | both: only near-identical bins
eukcc_executable: /DATA_LUN/skkumara/Final/Zosteria_marina/miniforge3/envs/eukcc22/bin/eukcc # EukCC executable
                         # (used when `conda` is not on PATH; the pipeline also finds a sibling env named eukcc_conda_env itself)

# Resource reporting (writes resource_report.tsv/json in the run output).
resource_profile_enabled: true
resource_profile_interval_seconds: 0.5
