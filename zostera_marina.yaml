# Zostera marina: exactly four TE combinations. Original configuration filename retained.
# Based on the supplied configuration; no claim of real-data validation.
# Preprocessing/features are shared; each run has its own encoder/clustering outputs.
# Main Python environment must contain the full pipeline dependencies and psutil.

# General: 32 threads; retain contigs starting at 1,000 bp
threads: 32
seed: 42
min_contig_length: 1000
force_trust_checkpoints: false

# Preprocessing
read_type: "short"
read_type_detect_seed: 0
auto_install_tools: false
dedup_ani: 99.5
dedup_min_af: 95.0
dedup_min_length_ratio: 0.0
dedup_min_length: 2000
dedup_cross_sample_only: false
dedup_skani_args: "-c 30 -m 200 --faster-small -s 95"
skip_dedup: false
dedup_max_contigs: 500000
tiara_min_len: 2000
tiara_prob_cutoff: [0.65, 0.65]
whokaryote_minsize: 2000
whokaryote_model: "T"
classification_confidence_high: 0.8
rule_based_high_conf_sources: null
barrnap_kingdom: "fun"
max_mapping_workers: "auto"
min_threads_per_sample: 8
adaptive_min_cov: 2.0
# One sample with qualifying depth and breadth is sufficient for direct retention.
adaptive_min_samples: 1
adaptive_min_breadth: 0.3
rescue_enabled: true
rescue_reference_fasta: ""
rescue_min_identity: 75.0
rescue_min_query_cov: 0.5
scoring_cov_cv_high: 1.5
scoring_gc_zscore_flag: 3.0
scoring_tnf_dist_flag: 2.5
enable_tnf_qc_signal: true

# Coverage features
coverage_k: 200
coverage_n_cores: null
coverage_strict_numeric_columns: true
coverage_outlier_cap_percentile: 99.5
coverage_deterministic: false
coverage_brute_force_max_n: 5000

# TE database: inherited path; verify it exists on your server
funTEdb: "/DATA_LUN/skkumara/databases/MycoMobilome_v1.1/MycoMobilome_v1.1-clustered_80_TE_library.fasta"

# TE features: fast uses MMseqs2; te_pa applies only to RepeatMasker mode
te_mode: "fast"
mmseqs_sensitivity: 5.7
mmseqs_min_seq_id: 0.7
mmseqs_coverage: 0.1
mmseqs_max_seq_len: 100000
mmseqs_evalue: 1e-05
te_pa: 8
te_frag: 20000000
te_min_sw_score: 225
apply_length_weight_to_features: false
full_confidence_te_bp: 5000
full_confidence_length: 10000
full_confidence_hits: 5
weight_te_coef: 0.55
weight_hit_coef: 0.25
weight_quality_coef: 0.2
repeatmasker_quality_reference_score: 1000.0
unclassified_warn_fraction: 0.95

# TNF features
min_contig_len: 1000
min_valid_kmers: 50
full_confidence_kmers: 5000
weight_mode: "confidence"

# Encoder: multi-run code selects the active inputs for each run
tnf_include: true
te_include: true
cov_include: true
allow_missing_modalities: false
device: "cpu"
parallel_phase1: false
parallel_phase1_max_workers: null
latent_dim_tnf: 32
latent_dim_te: 5
latent_dim_cov: null
final_dim: null
hidden_scale: 4
hidden_min: 32
hidden_max: 512
dropout: 0.1
n_hidden_layers: 2
beta_tnf: 0.01
beta_te: 0.1
beta_cov: 0.1
kl_anneal_epochs: 50
kl_free_bits: 0.01
phase1_epochs_tnf: 75
phase1_epochs_te: 50
phase1_epochs_cov: 50
phase2_epochs: 50
phase1_lr: 0.001
phase2_lr: 5e-05
loss_scale_tnf: 1.0
loss_scale_te: 0.1
loss_scale_cov: 0.1
loss_scale_fusion: 0.05
fusion_mode: "contig_weighted"
fusion_gate_entropy_weight: 0.01
cov_use_n_samples_present_as_feature: false
batch_size: null

# Clustering: initial clusters use contigs >=2,000 bp
hdbscan_algorithm: "best"
hdbscan_min_cluster_size: 30
hdbscan_min_samples: 5
hdbscan_epsilon: 0.0
hdbscan_method: "eom"
hdbscan_soft_prob_min: 0.35
cluster_min_contig_len: 2000

# Noise rescue
noise_rescue_enabled: true
noise_rescue_candidate: "knn"
noise_rescue_stage: "late"
noise_max_distance: 1.0
noise_rescue_min_margin: 0.0
noise_local_agreement_enabled: true
noise_local_k: 10
noise_local_min_support: 5
noise_local_agreement: 0.9
noise_reference_prob_min: 0.35
noise_neighbor_max_distance: 0.65
noise_query_batch_size: 4096

# Iterative refinement
max_iter: 0
convergence_threshold: 0.01
refinement_max_distance: 0.35

# Sub-clustering
subcluster_enabled: true
subcluster_min_bin_contigs: 2000
subcluster_method: "leaf"
subcluster_min_cluster_size: 15
subcluster_min_samples: 5
subcluster_tnf_sep_max: 2.0
subcluster_cov_merge_tau: 2.0
subcluster_min_part_bp: 500000
subcluster_noise_k: 10
subcluster_noise_min_agreement: 0.4
subcluster_max_misfit: 0.25
merge_max_gc_diff: 0.0
merge_gc_outside_max: 0.0
merge_gc_q_lo: 0.05
merge_gc_q_hi: 0.95
subcluster_te_mode: "auto"
subcluster_te_min_weight: 0.3
subcluster_te_min_agreement: 0.1

# Coverage-shape pruning
prune_enabled: true
prune_min_bin_contigs: 30
prune_shape_z: 4.0
prune_max_frac: 0.2

# Same-genome bin merging
binmerge_enabled: true
binmerge_tnf_sep_max: 2.0
binmerge_cov_tau: 2.0
binmerge_min_contigs: 10
binmerge_max_misfit: 0.25
binmerge_misfit_z: 4.0
binmerge_min_tnf_mix: 0.0

# Reassignment
reassign_enabled: true
reassign_k: 20
reassign_min_votes: 5
reassign_max_z: 3.0

# TNF consensus
tnf_consensus_enabled: false
tnf_consensus_k: 15
tnf_consensus_min: 0.8
tnf_consensus_iters: 5
tnf_consensus_max_z: 3.0

# Placement of subclusters
subcluster_best_home: true
refine_cov_standardize: true
best_home_k: 15
best_home_min_share: 0.7
best_home_max_ratio: 1.5
best_home_sample: 300

# Marker-checked merging
marker_merge_enabled: false
marker_min_bp: 500000
marker_max_checks: 40
marker_min_gain: 5.0
marker_max_cont_increase: 2.0

# Recruit retained 1,000-1,999 bp contigs into established bins
recruit_enabled: true
recruit_min_len: 1000
recruit_k: 15
recruit_min_support: 10
recruit_agreement: 0.9
recruit_max_dist: 0.5

# Bin filtering and skani deduplication
min_contigs_per_bin: 1
min_bin_length_bp: 500000
min_bin_n50_bp: 1000
skani_ani_threshold: 99.0
skani_min_af: 80.0

# EukCC: score individual runs; preserve existing merge-off policy
run_eukcc: true
eukcc_single_per_bin: true
eukcc_db: "/DATA_LUN/skkumara/databases/eukcc2_db_ver_1.1/"
eukcc_conda_env: "eukcc22"
eukcc_scratch_dir: "/tmp"
eukcc_merge_enabled: false
eukcc_merge_n_combine: 1
eukcc_merge_ani: 99
eukcc_merge_within: 1500

# Runtime
compute_silhouette: false
resume: true
clustering_backend: "cpu"
clustering_threads: 32
clustering_seed: 42
clusters_non_deduplicated_dir: "clusters_non_deduplicated"
clusters_deduplicated_dir: "clusters_deduplicated"

# Run exactly te, tecov, tetnf, tetnfcov.
# best_of_runs retains the requested pair. tnfcov is NOT run here.
# It contributes only if existing bins are present under <outdir>/runs/tnfcov/clustering/clusters_deduplicated/.
# Without those bins, the current best-of code skips tnfcov and pools tetnfcov alone.
all_runs: false
te_runs: true
modality_runs: ["tecov"]
best_of_it: true
best_of_runs: ["tetnfcov", "tnfcov"]
best_of_af_mode: "contained"
eukcc_executable: "/DATA_LUN/skkumara/Final/Zosteria_marina/miniforge3/envs/eukcc22/bin/eukcc"

# Resource reports
resource_profile_enabled: true
resource_profile_interval_seconds: 0.5

# Explicit preprocessing v4 policy; same-sample depth and breadth
adaptive_cov_stat: "sample"
adaptive_gray_ceiling: 2000
prokaryote_removal_enabled: true
prokaryote_min_length: 3000
organelle_removal_enabled: false
